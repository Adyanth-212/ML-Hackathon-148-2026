# HMM / Viterbi decoder parameters. classifier_weight and beta_m were tuned by
# scripts/eval_hmm.py: grid on the 80 TRAIN trips with out-of-fold classifier scores
# (experiments/results/hmm_grid.csv). Never tuned on evaluator trips.
emission:
  prob_floor: 1.0e-06
  distance_sigma_m: 10.0
  classifier_weight: 1.0
transition:
  beta_m: 5.0
  max_route_factor: 2.0
  route_slack_m: 200.0
gaps:
  break_seconds: 30.0
