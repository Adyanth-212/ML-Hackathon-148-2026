# Bayesian optimisation of the selected classifier (LightGBM), scripts/optimize.py
#
# Objective: maximise mean cross-validated observation-level Top-1 on the 80 train trips,
# with the harness's fixed folds: GroupKFold(5, shuffle=True, random_state=148) by trip.
# Top-1 is the primary metric and the model-selection rule (scripts/export_artifacts.py), so
# the tuning objective is the same thing. student_test is NOT used during the search; it is
# scored once after the search, on the refitted best model (harness), for the untuned vs tuned table.
# The evaluator partition is never read.

model: lightgbm
study_name: lgbm_top1_v1
sampler: {name: tpe, seed: 148, n_startup_trials: 10, multivariate: true}
# Running mean Top-1 after each fold is reported; a trial is pruned when it is below the
# median of earlier trials at the same fold (folds always run in the same order).
pruner: {name: median, n_startup_trials: 10, n_warmup_steps: 1}
n_trials: 40
timeout_minutes: 90

# Trial 0 is the untuned configuration (scripts/models/advitha_lgbm.py), so the search starts
# from the baseline and the record contains it.
enqueue_baseline: true

fixed:
  objective: binary
  subsample_freq: 1

# Why these ranges:
# - learning_rate x n_estimators trade off: lower rates need more trees. The cap of 1000 trees
#   keeps a trial under ~3 min on 8 cores.
# - num_leaves controls tree complexity (leaf-wise growth); 15-255 spans shallow to deep.
# - min_child_samples, reg_lambda and reg_alpha are the main regularisers against overfitting
#   the ~2M candidate rows from only 80 trips (rows within a trip are strongly correlated).
# - subsample / colsample_bytree add randomness (bagging), which also regularises.
# - log scale for parameters whose effect is multiplicative.
search_space:
  n_estimators:      {type: int,   low: 200,  high: 1000, step: 50}
  learning_rate:     {type: float, low: 0.01, high: 0.2,  log: true}
  num_leaves:        {type: int,   low: 15,   high: 255,  log: true}
  min_child_samples: {type: int,   low: 10,   high: 400,  log: true}
  subsample:         {type: float, low: 0.5,  high: 1.0}
  colsample_bytree:  {type: float, low: 0.4,  high: 1.0}
  reg_lambda:        {type: float, low: 0.001, high: 30.0, log: true}
  reg_alpha:         {type: float, low: 0.001, high: 10.0, log: true}
